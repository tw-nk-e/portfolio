name: Deploy GitHub Page

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
  contents: read # This is required for actions/checkout.
  pages: write
  id-token: write # This is required for requesting the JWT (AWS OIDC).

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Automatically sets the correct `base_path`.
      - uses: actions/configure-pages@v6
      # Install npm dependencies for CI/CD.
      - name: pre_build
        run: npm ci
      - name: build
        run: npm run build
        env:
          # Serves the site at /<repo-name>. If you're using a repo named
          # <your-username>.github.io (the “user” site), replace the line below
          # with: PAGES_BASE_PATH: “”
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Uploading artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
